# Minimal glass-style card. Requires button-card 7+ (HACS).
# Change only variables.sensor to your YaBusTracker entity ID.
type: custom:button-card
variables:
  sensor: sensor.test_stop_16_terminus
show_name: false
show_icon: false
show_state: false
# Local display refresh only: this never calls the transport API.
# No entity on the outer card: update_timer controls its render cadence.
update_timer: 10s
tap_action:
  action: none
styles:
  card:
    - border-radius: 26px
    - padding: 18px
    - border: 1px solid rgba(210, 225, 245, 0.13)
    - background: linear-gradient(135deg, rgba(55, 61, 73, 0.82), rgba(15, 19, 27, 0.88))
    - box-shadow: inset 0 1px 1px rgba(255,255,255,0.12), 0 8px 24px rgba(0,0,0,0.16)
    - backdrop-filter: blur(16px)
    - -webkit-backdrop-filter: blur(16px)
    - text-align: left
    - overflow: hidden
    - font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
  grid:
    - grid-template-areas: '"body"'
    - grid-template-columns: minmax(0, 1fr)
    - grid-template-rows: min-content
  custom_fields:
    body:
      - width: 100%
      - min-width: 0
      - justify-self: stretch
      - white-space: normal
      - text-align: left
    settings:
      - position: absolute
      - top: 18px
      - right: 18px
custom_fields:
  settings:
    card:
      type: custom:button-card
      name: Настройки YaBusTracker
      icon: mdi:cog-outline
      show_name: false
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /config/integrations/integration/yandex_transit
      styles:
        card:
          - width: 34px
          - height: 34px
          - padding: 8px
          - border-radius: 50%
          - border: 1px solid rgba(220,230,245,0.18)
          - background: rgba(255,255,255,0.055)
          - box-shadow: inset 0 1px 1px rgba(255,255,255,0.08)
        icon:
          - width: 18px
          - color: '#cbd3df'
  body: |
    [[[
      const item = states[variables.sensor];
      const a = item?.attributes ?? {};
      const now = Date.now();
      const failed = item?.state === 'unavailable' || ['error', 'stale'].includes(a.status);
      const sleeping = a.status === 'sleeping';
      const available = !!item && !failed && a.status === 'ok';
      const arrivals = (available && Array.isArray(a.arrivals) ? a.arrivals : [])
        .filter(x => Number.isFinite(Date.parse(x.timestamp)) && Date.parse(x.timestamp) > now)
        .slice(0, 3);
      const escape = value => String(value ?? '').replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const time = (value, seconds = false) => {
        const stamp = Date.parse(value);
        if (!Number.isFinite(stamp)) return '—';
        return new Intl.DateTimeFormat(hass.locale?.language || 'ru', {
          timeZone: hass.config.time_zone, hour: '2-digit', minute: '2-digit',
          ...(seconds ? {second: '2-digit'} : {}), hour12: false
        }).format(new Date(stamp));
      };
      let content;
      if (sleeping) {
        content = `<div class="yabt-message yabt-sleep"><ha-icon icon="mdi:power-sleep"></ha-icon><span>Режим сна · запросы до ${escape(time(a.next_attempt))}</span></div>`;
      } else if (failed) {
        content = `<div class="yabt-message yabt-error"><ha-icon icon="mdi:alert-circle-outline"></ha-icon><span>Не удалось обновить${a.status === 'stale' ? ' · данные устарели' : ''}</span></div>`;
      } else if (arrivals.length) {
        content = `<div class="yabt-arrivals">${arrivals.map(x => {
          const minutes = Math.ceil((Date.parse(x.timestamp) - now) / 60000);
          const scheduled = x.source === 'scheduled';
          return `<div class="yabt-arrival ${scheduled ? 'yabt-scheduled' : 'yabt-estimated'}" aria-label="Через ${minutes} мин, ${scheduled ? 'по расписанию' : 'прогноз'}"><div class="yabt-minutes">${minutes}<span>мин</span></div><div class="yabt-time">${escape(time(x.timestamp))}</div><div class="yabt-source">${scheduled ? 'по расписанию' : 'прогноз'}</div></div>`;
        }).join('')}</div>`;
      } else {
        content = `<div class="yabt-message"><ha-icon icon="mdi:clock-outline"></ha-icon><span>${['ok', 'no_data'].includes(a.status) ? 'Нет данных' : 'Данные ещё не получены'}</span></div>`;
      }
      return `<div class="yabt-header" style="display:grid;grid-template-columns:34px minmax(0,1fr);justify-content:start;text-align:left"><ha-icon icon="mdi:bus-clock"></ha-icon><div class="yabt-heading"><div class="yabt-title">Автобус №${escape(a.route || '—')}</div><div class="yabt-subtitle">${escape(a.stop_name || 'Остановка не настроена')}<span> → ${escape(a.direction || '—')}</span></div></div></div>${content}<div class="yabt-footer"><span class="yabt-dot ${failed ? 'yabt-bad' : ''}"></span>Обновлено: ${a.last_success ? escape(time(a.last_success, true)) : 'ещё не обновлялось'}</div>`;
    ]]]
extra_styles: |
  .yabt-header { display:flex; justify-content:flex-start; align-items:center; gap:12px; padding-right:42px; margin-bottom:17px; min-height:40px; text-align:left; }
  .yabt-header > ha-icon { --mdc-icon-size:34px; width:34px; height:34px; color:#7cc9ff; flex:0 0 34px; }
  .yabt-heading { min-width:0; text-align:left; }
  .yabt-title { color:#f2f5fa; font-size:20px; font-weight:750; letter-spacing:-0.35px; line-height:1.15; }
  .yabt-subtitle { margin-top:5px; color:#aebccd; font-size:11px; line-height:1.4; overflow-wrap:anywhere; }
  .yabt-subtitle span { color:#c8d8eb; }
  .yabt-arrivals { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:8px; }
  .yabt-arrival { min-width:0; padding:13px 4px 11px; border-radius:21px; border:1px solid rgba(75,145,222,0.3); background:rgba(28,72,123,0.3); box-shadow:inset 0 1px 0 rgba(176,214,255,0.08); text-align:center; }
  .yabt-arrival:first-child, .yabt-arrival:first-child.yabt-scheduled { border-color:rgba(126,211,255,0.92); background:linear-gradient(180deg, rgba(37,151,231,0.98), rgba(5,111,191,0.98)); box-shadow:inset 0 1px 0 rgba(255,255,255,0.24), 0 4px 14px rgba(0,127,218,0.28); }
  .yabt-arrival.yabt-scheduled { border-color:rgba(164,183,211,0.25); background:rgba(118,135,158,0.12); }
  .yabt-minutes { color:#f2f5fa; white-space:nowrap; font-size:29px; font-weight:750; line-height:1.1; letter-spacing:-0.7px; font-variant-numeric:tabular-nums; }
  .yabt-minutes span { margin-left:4px; color:#b2c6df; font-size:11px; font-weight:500; letter-spacing:0; }
  .yabt-time { margin-top:6px; color:#cfdef0; font-size:12px; font-variant-numeric:tabular-nums; }
  .yabt-source { margin-top:5px; color:#88bff3; font-size:10px; white-space:nowrap; }
  .yabt-scheduled .yabt-source { color:#b7c2d1; }
  .yabt-arrival:first-child .yabt-minutes, .yabt-arrival:first-child .yabt-time { color:#ffffff; }
  .yabt-arrival:first-child .yabt-minutes span, .yabt-arrival:first-child .yabt-source { color:#d9f1ff; }
  .yabt-footer { display:flex; align-items:center; gap:6px; margin-top:14px; color:#9caabe; font-size:10px; }
  .yabt-dot { width:5px; height:5px; border-radius:50%; background:#77baff; flex-shrink:0; }
  .yabt-dot.yabt-bad { background:#ff776c; }
  .yabt-message { display:flex; gap:8px; align-items:center; padding:18px 13px; border-radius:20px; background:rgba(160,177,198,0.09); color:#cbd4df; font-size:12px; line-height:1.4; }
  .yabt-message ha-icon { --mdc-icon-size:20px; width:20px; height:20px; flex:0 0 20px; }
  .yabt-message.yabt-error { background:rgba(151,49,45,0.18); border:1px solid rgba(245,99,90,0.28); color:#ff8c83; }
  .yabt-message.yabt-sleep { color:#b8c9dd; }
